worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  server {
    server_name admin.securefirst.co;
    client_max_body_size 50m;
    root /var/www/admin;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
  
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.securefirst.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.securefirst.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
  server {
    server_name api.securefirst.co;
    client_max_body_size 50m;
    location / {
      proxy_pass http://127.0.0.1:5001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.securefirst.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.securefirst.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    if ($host = admin.securefirst.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.securefirst.co;
    return 404; # managed by Certbot


}
  server {
    if ($host = api.securefirst.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.securefirst.co;
    return 404; # managed by Certbot


}}
